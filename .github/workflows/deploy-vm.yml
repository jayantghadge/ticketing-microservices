name: Deploy to VM (Docker Compose)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven
      - name: Build all services
        run: |
          for dir in inventoryservice bookingservice orderservice apigateway; do
            mvn package -DskipTests --file "$dir/pom.xml"
            docker build -t ticketing/$dir "$dir"
          done
      - name: Save images & copy to VM
        run: |
          docker save ticketing/apigateway ticketing/bookingservice \
            ticketing/inventoryservice ticketing/orderservice \
            -o images.tar
      - name: Deploy via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: images.tar,docker-compose.yml,inventoryservice/docker-compose.yml
          target: /opt/ticketing
      - name: Restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /opt/ticketing
            docker load -i images.tar
            docker compose -f docker-compose.yml up -d
