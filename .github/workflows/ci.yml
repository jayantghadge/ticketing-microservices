name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven
      - name: Build & test all services
        run: |
          for service in inventoryservice bookingservice orderservice apigateway; do
            echo "=== $service ==="
            mvn clean test --file "$service/pom.xml"
          done
