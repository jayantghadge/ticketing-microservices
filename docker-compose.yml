services:
  mysql:
    image: mysql:8.3.0
    container_name: ticketing-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ticketing
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 3000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  keycloak-db:
    image: mysql:8.3.0
    container_name: keycloak-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: password
    volumes:
      - keycloak-mysql-data:/var/lib/mysql

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    depends_on:
      - keycloak-db
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://keycloak-db:3306/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8091:8080"
    volumes:
      - ./inventoryservice/docker/keycloak/realms/:/opt/keycloak/data/import/

  inventoryservice:
    build: ./inventoryservice
    container_name: inventoryservice
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ticketing
      DB_USERNAME: root
      DB_PASSWORD: password

  bookingservice:
    build: ./bookingservice
    container_name: bookingservice
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ticketing
      DB_USERNAME: root
      DB_PASSWORD: password
      INVENTORY_SERVICE_URL: http://inventoryservice:8080/api/v1/inventory
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  orderservice:
    build: ./orderservice
    container_name: orderservice
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ticketing
      DB_USERNAME: root
      DB_PASSWORD: password
      INVENTORY_SERVICE_URL: http://inventoryservice:8080/api/v1/inventory
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  apigateway:
    build: ./apigateway
    container_name: apigateway
    depends_on:
      - inventoryservice
      - bookingservice
      - keycloak
    ports:
      - "8090:8090"
    environment:
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/ticketing-security-realm/protocol/openid-connect/certs
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/ticketing-security-realm
      INVENTORY_SERVICE_URL: http://inventoryservice:8080
      BOOKING_SERVICE_URL: http://bookingservice:8081

volumes:
  mysql-data:
  keycloak-mysql-data:
